<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dmesh logo">
  <defs>
    <linearGradient id="dm-g" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38E1C6"/>
      <stop offset="0.55" stop-color="#2BB6FF"/>
      <stop offset="1" stop-color="#5B7CFA"/>
    </linearGradient>
  </defs>
  <!-- shield: trustless, non-custodial protection -->
  <path d="M64 8 L108 24 V62 C108 90 89 110 64 120 C39 110 20 90 20 62 V24 L64 8 Z"
        fill="#0B1226" stroke="url(#dm-g)" stroke-width="5" stroke-linejoin="round"/>
  <!-- decentralized mesh: nodes and links, no central hub -->
  <g stroke="url(#dm-g)" stroke-width="3.2" stroke-linecap="round" opacity="0.9">
    <line x1="40" y1="52" x2="64" y2="40"/>
    <line x1="64" y1="40" x2="88" y2="52"/>
    <line x1="40" y1="52" x2="40" y2="78"/>
    <line x1="88" y1="52" x2="88" y2="78"/>
    <line x1="40" y1="78" x2="64" y2="90"/>
    <line x1="88" y1="78" x2="64" y2="90"/>
    <line x1="40" y1="52" x2="88" y2="78"/>
    <line x1="88" y1="52" x2="40" y2="78"/>
  </g>
  <g fill="url(#dm-g)">
    <circle cx="40" cy="52" r="6"/>
    <circle cx="88" cy="52" r="6"/>
    <circle cx="40" cy="78" r="6"/>
    <circle cx="88" cy="78" r="6"/>
  </g>
  <!-- central verification node -->
  <circle cx="64" cy="40" r="6.5" fill="#EAFBFF"/>
  <circle cx="64" cy="90" r="6.5" fill="#EAFBFF"/>
  <path d="M64 58 l7 7 -7 7 -7 -7 z" fill="#38E1C6"/>
</svg>
