name: geo-db-refresh

# GeoLite2 databases are refreshed daily and published as rolling release
# assets on the "geoip-latest" tag. The coordinator never classifies IPs:
# node and consuming clients download these databases and derive country and
# residential/datacenter tier locally, then sign their own claims. Requires
# MAXMIND_LICENSE_KEY (a free GeoLite2 account) as a repository secret.
# Databases are released as assets rather than committed to git history.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download GeoLite2 databases
        run: |
          mkdir -p geoip
          curl -sL "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=${MAXMIND_KEY}&suffix=tar.gz" -o country.tgz
          curl -sL "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key=${MAXMIND_KEY}&suffix=tar.gz" -o asn.tgz
          tar xzf country.tgz
          tar xzf asn.tgz
          cp GeoLite2-Country_*/GeoLite2-Country.mmdb geoip/
          cp GeoLite2-ASN_*/GeoLite2-ASN.mmdb geoip/
          tar -czf geoip-mmdb.tar.gz -C geoip .
        env:
          MAXMIND_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      - name: Publish rolling release assets
        run: |
          gh release create geoip-latest --title "GeoLite2 rolling update" \
            --notes "Refreshed daily by CI." || true
          gh release upload geoip-latest geoip-mmdb.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
