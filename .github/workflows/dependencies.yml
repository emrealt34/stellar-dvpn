name: dependencies

# Refreshes docs/DEPENDENCIES.md (direct dependencies, available updates,
# vulnerability scan summaries). Runs weekly and on demand, and commits the
# regenerated report when it changes.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Generate report
        run: ./scripts/dependency-report.sh
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: docs/DEPENDENCIES.md
      - name: Commit if changed
        run: |
          git config user.name "dmesh-bot"
          git config user.email "bot@dmesh.network"
          git add docs/DEPENDENCIES.md
          if git diff --cached --quiet; then
            echo "No dependency changes."
          else
            git commit -m "docs: refresh dependency & vulnerability report"
            git push
          fi
