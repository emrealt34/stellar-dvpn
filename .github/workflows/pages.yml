name: pages

# Publishes the static marketing/download site in site/ to GitHub Pages.
# Pages is configured with build_type=workflow (set via the GitHub API), so
# this action is the sole deployer; no branch-based Jekyll build is used.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent Pages deploys overwriting each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy site to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
